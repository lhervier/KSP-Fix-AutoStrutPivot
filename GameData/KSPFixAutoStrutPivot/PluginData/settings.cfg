// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Keeps the autostrut of an unlocked robotic part in Heaviest mode on its own side of its pivot: it goes to the
// heaviest part on the side it leaves from. Without it, the strut can join both sides of the pivot (a piston strutted
// to a heavy part carried at the end of its rod), and the robotic part can no longer move what it carries.
heaviestOnOwnSide = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time the autostrut of a
// robotic part would have crossed its pivot, with the part it goes to instead.
logLevel = Info
